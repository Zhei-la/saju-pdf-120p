<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무료사주 웹사이트 생성</title>
<style>
body{margin:0;background:#f4ecdf;font-family:'Malgun Gothic',sans-serif;color:#2c1810}
.wrap{max-width:760px;margin:40px auto;padding:20px}
.card{background:#fffdf8;border:1px solid #d9bc84;border-radius:24px;padding:35px}
h1{font-size:42px;margin:0 0 15px}
p{line-height:1.7;color:#6d5a46}
label{display:block;margin-top:24px;margin-bottom:10px;font-size:22px;font-weight:700}
input,textarea{width:100%;box-sizing:border-box;padding:18px;border-radius:14px;border:1px solid #d9bc84;font-size:18px}
textarea{min-height:130px}
button{width:100%;margin-top:30px;padding:20px;border:0;border-radius:14px;background:#1f0d07;color:#d6a642;font-size:22px;font-weight:800;cursor:pointer}
.result{display:none;margin-top:30px;padding:25px;border-radius:18px;background:#f7efe2}
.result a{color:#8a5b00;font-size:20px;font-weight:700;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>무료사주 웹사이트 생성</h1>
    <p>브랜드명과 카카오톡 상담 링크를 저장하면 고객에게 보낼 수 있는 무료사주 링크가 생성됩니다.</p>

    <label>브랜드명</label>
    <input id="brandName" type="text" placeholder="예: 루월당">

    <label>카카오톡 상담 링크</label>
    <input id="kakaoLink" type="text" placeholder="https://open.kakao.com/o/...">

    <label>소개 문구</label>
    <textarea id="introText" placeholder="예: 당신의 사주 흐름을 간단히 확인해드립니다."></textarea>

    <button id="saveBtn">무료사주 웹사이트 저장하기</button>

    <div class="result" id="resultBox">
      <h2>생성 완료</h2>
      <p><a id="siteLink" href="#" target="_blank"></a></p>
      <button id="copyBtn">링크 복사하기</button>
    </div>
  </div>
</div>

<script>
document.getElementById('saveBtn').addEventListener('click', async function () {
  const brandName = document.getElementById('brandName').value.trim();
  const kakaoLink = document.getElementById('kakaoLink').value.trim();
  const introText = document.getElementById('introText').value.trim();

  console.log('brandName:', brandName);
  console.log('kakaoLink:', kakaoLink);

  if (!brandName) {
    alert('브랜드명을 입력해주세요.');
    return;
  }

  if (!kakaoLink) {
    alert('카카오톡 링크를 입력해주세요.');
    return;
  }

  const response = await fetch('/api/free-site', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ brandName, kakaoLink, introText })
  });

  const data = await response.json();

  if (!response.ok) {
    alert(data.error || '저장 실패');
    return;
  }

  const url = location.origin + data.url;
  const siteLink = document.getElementById('siteLink');

  siteLink.href = url;
  siteLink.textContent = url;
  document.getElementById('resultBox').style.display = 'block';
});

document.getElementById('copyBtn').addEventListener('click', function () {
  const text = document.getElementById('siteLink').textContent;
  navigator.clipboard.writeText(text);
  alert('링크가 복사되었습니다.');
});
</script>
</body>
</html>
