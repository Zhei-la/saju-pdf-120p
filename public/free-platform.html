<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무료사주 웹사이트 생성</title>
<style>
body{margin:0;font-family:'Noto Sans KR',Arial,sans-serif;background:#f5ede0;color:#2c1810}
.wrap{max-width:760px;margin:0 auto;padding:34px 18px}
.card{background:#fffdf8;border:1px solid #d8bd86;border-radius:22px;padding:30px;box-shadow:0 16px 45px rgba(44,24,16,.12)}
h1{font-size:28px;margin:0 0 10px}
p{color:#7a6652;line-height:1.7}
label{display:block;margin-top:18px;font-weight:800}
input,textarea{width:100%;box-sizing:border-box;padding:14px;margin-top:8px;border:1px solid #d8bd86;border-radius:12px;font-size:15px}
button{margin-top:22px;width:100%;padding:16px;border:0;border-radius:14px;background:#2c1810;color:#d4a843;font-size:16px;font-weight:900;cursor:pointer}
.result{margin-top:22px;padding:18px;background:#f7efe2;border:1px solid #d8bd86;border-radius:14px;display:none}
a{color:#8b5e00;font-weight:900;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>무료사주 웹사이트 생성</h1>
    <p>브랜드명과 카카오톡 상담 링크를 저장하면, 고객에게 보낼 수 있는 무료사주 웹사이트 링크가 고정 생성됩니다.</p>

    <label>브랜드명</label>
    <input id="brandName" placeholder="예: 루월당">

    <label>카카오톡 상담 링크</label>
    <input id="kakaoLink" placeholder="https://open.kakao.com/o/...">

    <label>소개 문구</label>
    <textarea id="introText" rows="4" placeholder="예: 당신의 사주 흐름을 간단히 확인해드립니다."></textarea>

    <button onclick="createSite()">무료사주 웹사이트 저장하기</button>

    <div id="result" class="result">
      <b>생성된 링크</b>
      <p><a id="siteLink" href="#" target="_blank"></a></p>
      <button onclick="copyLink()">링크 복사하기</button>
    </div>
  </div>
</div>

<script>
async function createSite(){
  const brandName=document.getElementById('brandName').value.trim();
  const kakaoLink=document.getElementById('kakaoLink').value.trim();
  const introText=document.getElementById('introText').value.trim();

  const res=await fetch('/api/free-site',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({brandName,kakaoLink,introText})
  });

  const json=await res.json();
  if(!res.ok){alert(json.error||'저장 실패');return;}

  const link=location.origin+json.url;
  const a=document.getElementById('siteLink');
  a.href=link;
  a.textContent=link;
  document.getElementById('result').style.display='block';
}
function copyLink(){
  navigator.clipboard.writeText(document.getElementById('siteLink').textContent);
  alert('링크가 복사되었습니다.');
}
</script>
</body>
</html>
