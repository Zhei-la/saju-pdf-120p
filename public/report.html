  /* ?좉? 踰꾪듉 */
  .toggle-group { display: flex; gap: 0; border: 1px solid var(--parchment-dark);
    background: rgba(255,255,255,0.4); }
  .toggle-btn { flex: 1; padding: 12px; border: none; background: transparent;

  .toggle-btn:hover { color: var(--deep); }
  .toggle-btn.active { background: var(--deep); color: var(--gold-light); font-weight: 600; }
  .toggle-btn + .toggle-btn { border-left: 1px solid var(--parchment-dark); }
  .toggle-btn.active + .toggle-btn { border-left-color: var(--deep); }

  /* ?앸뀈?붿씪 + ?쒓컙 ?쒖쨪 ?덉씠?꾩썐 */
  .date-row { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 8px; }
  .date-row select, .date-row input { padding: 10px 8px; }

  /* 泥댄겕諛뺤뒪 */

  .check-row input[type="checkbox"] { width: auto; cursor: pointer; }

  .btn { padding: 13px 22px; border: none; cursor: pointer;

  .btn-primary { background: var(--deep); color: var(--gold-light); width: 100%; padding: 16px; letter-spacing: 5px; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(44,24,16,0.22); }
  .btn-gold { background: linear-gradient(135deg, var(--gold), #a07000); color: var(--deep); font-weight: 700; }
  .btn-gold:hover:not(:disabled) { transform: translateY(-1px); }
  .btn-ghost { background: transparent; border: 1px solid var(--parchment-dark); color: var(--muted); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--gold); color: var(--deep); }
  .btn-small { padding: 6px 12px; font-size: 11px; letter-spacing: 1px; font-family: 'Noto Sans KR', sans-serif; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn-row .btn { flex: 1; }

  /* API ??移대뱶 */
  .key-card { border: 1px solid var(--parchment-dark); padding: 20px 24px;
    background: rgba(255,253,248,0.85); margin-bottom: 18px; }
  .key-row { display: flex; gap: 10px; align-items: flex-end; }
  .key-row .field { flex: 1; margin-bottom: 0; }
  .key-collapsed { display: flex; justify-content: space-between; align-items: center;
    font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: var(--muted); }
  .key-collapsed .status { display: flex; align-items: center; gap: 8px; }
  .key-collapsed .dot { width: 8px; height: 8px; border-radius: 50%; background: #2d9d52; }
  .key-help { font-size: 11px; color: var(--muted); font-family: 'Noto Sans KR', sans-serif;
    margin-top: 8px; line-height: 1.7; }
  .key-help a { color: var(--gold); text-decoration: none; border-bottom: 1px dotted var(--gold); }

  /* 紐⑤떖 */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(26,18,9,0.75);

    backdrop-filter: blur(4px); }
  .modal-backdrop.show { display: flex; }
  .modal { background: var(--parchment); border: 2px solid var(--gold);

  .modal-close { position: absolute; top: 16px; right: 20px; background: none; border: none;

  .modal-close:hover { color: var(--deep); }
  .modal h2 { font-size: 18px; color: var(--deep); margin-bottom: 14px; letter-spacing: 2px; }
  .modal p { font-size: 12px; font-family: 'Noto Sans KR', sans-serif; color: var(--muted);

  .modal table { width: 100%; border-collapse: collapse; font-family: 'Noto Sans KR', sans-serif; }

  .modal td:first-child { color: var(--gold); font-weight: 600; }
  .modal td:last-child { color: var(--ink); }

  /* ?곹깭 */

  .status-box.ok { background: rgba(45,157,82,0.08); color: #2d9d52; border: 1px solid rgba(45,157,82,0.25); }
  .status-box.loading { background: rgba(26,18,9,0.05); color: var(--muted); border: 1px solid var(--parchment-dark); }
  .loader { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--parchment-dark);

  /* 梨뺥꽣 */
  .saju-info { background: rgba(184,134,11,0.08); border: 1px solid rgba(184,134,11,0.25);

  .saju-info b { color: var(--deep); }
  .chapter { background: rgba(255,253,248,0.72); border: 1px solid var(--parchment-dark);

  .chapter-head { display: flex; justify-content: space-between; align-items: center;

  .chapter-title { font-size: 17px; color: var(--deep); font-weight: 700; }

  .regen-box { display: none; margin-top: 12px; padding: 14px; background: rgba(184,134,11,0.05);

  .chapter.regenerating .regen-box { display: block; }

  .hidden { display: none !important; }
  .toolbar { position: sticky; top: 12px; z-index: 10; display: flex; gap: 10px;

  /* PDF ?뚮뜑??*/
  .pdf-render { position: absolute; left: -99999px; top: 0; width: 794px; }

// ?? ?쒓컙 蹂댁젙 ?곸슜 ??
function applyCityOffset(hour, minute, cityKey) {
  const offset = CITY_OFFSETS[cityKey] || 0;
  let totalMin = hour * 60 + minute + offset;
  let dayShift = 0;
  while (totalMin < 0) { totalMin += 24 * 60; dayShift--; }
  while (totalMin >= 24 * 60) { totalMin -= 24 * 60; dayShift++; }
  return {
    hour: Math.floor(totalMin / 60),
    minute: totalMin % 60,
    dayShift
  };
}

// ?? 由ы룷???앹꽦 ??
async function generateReport() {
  const apiKey = getApiKey();
  if (!apiKey) { showStatus('genStatus', 'OpenAI API ?ㅻ? 癒쇱? ??ν빐二쇱꽭??', 'err'); return; }

  const name = document.getElementById('name').value.trim();
  const year = document.getElementById('year').value;
  const month = document.getElementById('month').value;
  const day = document.getElementById('day').value;
  const isTimeUnknown = document.getElementById('timeUnknown').checked;
  const cityKey = document.getElementById('city').value;

  if (!name) return showStatus('genStatus', '?대쫫???낅젰?댁＜?몄슂.', 'err');
  if (!year || !month || !day) return showStatus('genStatus', '?앸뀈?붿씪??紐⑤몢 ?낅젰?댁＜?몄슂.', 'err');

  let hourVal, minuteVal;
  if (isTimeUnknown) {
    hourVal = null; minuteVal = null;
  } else {
    const hv = document.getElementById('hour').value;
    if (hv === '') return showStatus('genStatus', '?쒖뼱???쒓컙???좏깮?섍굅??"?쒓컙??紐⑤쫫"??泥댄겕?댁＜?몄슂.', 'err');
    hourVal = parseInt(hv);
    minuteVal = parseInt(document.getElementById('minute').value) || 0;
  }

  // ?꾩떆 蹂댁젙 ?곸슜
  let yearN = parseInt(year), monthN = parseInt(month), dayN = parseInt(day);
  if (!isTimeUnknown) {
    const adjusted = applyCityOffset(hourVal, minuteVal, cityKey);
    hourVal = adjusted.hour;
    minuteVal = adjusted.minute;
    if (adjusted.dayShift !== 0) {
      const d = new Date(yearN, monthN - 1, dayN);
      d.setDate(d.getDate() + adjusted.dayShift);
      yearN = d.getFullYear();
      monthN = d.getMonth() + 1;
      dayN = d.getDate();
    }
  }

  const data = {
    apiKey, name,
    gender: selectedGender,
    year: yearN, month: monthN, day: dayN,
    hour: hourVal, minute: minuteVal,
    timeUnknown: isTimeUnknown,
    city: cityKey,
    isLunar: selectedCalendar === 'lunar',
    reportType: selectedReportType
  };

  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.textContent = '?앹꽦 以?..';
  const chapCount = selectedReportType === 'half' ? 20 : 40;
  const timeEst = selectedReportType === 'half' ? '??2~3遺? : '??3~5遺?;
  showStatus('genStatus', `<span class="loader"></span>${chapCount}梨뺥꽣 遺꾩꽍 以?.. ${timeEst} ?뚯슂?⑸땲?? ?좎떆留?湲곕떎?ㅼ＜?몄슂.`, 'loading');

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-auth-token': localStorage.getItem('auth_token') || '' },
      body: JSON.stringify(data)
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || '?ㅻ쪟');

    currentUserInfo = json.userInfo;
    currentUserInfo.cityName = document.getElementById('city').selectedOptions[0].textContent;
    currentUserInfo.reportType = json.reportType || selectedReportType;
    currentChapters = json.chapters;
    renderPreview();
  } catch (e) {
    showStatus('genStatus', '??' + e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '由ы룷???앹꽦 ?쒖옉';
  }
}

// ???섏씠吏???ㅼ뼱媛?蹂몃Ц 湲????異붿젙 (Noto Sans KR 15px / line-height 2.1 / A4 蹂몃Ц ?곸뿭)
const PDF_CHARS_PER_PAGE = 1100; // 蹂댁닔?곸쑝濡??≪븘 ?덉쟾?섍쾶

// 梨뺥꽣 蹂몃Ц???섏씠吏 ?⑥쐞濡?遺꾪븷 (?⑤씫 寃쎄퀎?먯꽌 ?딄린)
function splitContentIntoPages(content, maxCharsPerPage) {
  const paragraphs = String(content || '').split(/\n\s*\n/);
  const pages = [];
  let buf = '';
  for (const p of paragraphs) {
    if (!p.trim()) continue;
    // ?꾩옱 踰꾪띁???⑤씫 異붽??덉쓣 ???섏씠吏 ?쒓퀎瑜??섏쑝硫??섏씠吏 ?リ퀬 ???섏씠吏
    if (buf && (buf.length + p.length + 2) > maxCharsPerPage) {
      pages.push(buf);
      buf = p;
    } else {
      buf = buf ? buf + '\n\n' + p : p;
    }
    // ???⑤씫???덈Т 湲몄뼱?????섏씠吏?????ㅼ뼱媛???    while (buf.length > maxCharsPerPage * 1.3) {
      // 臾몄옣 ?⑥쐞 ?딄린 ?쒕룄
      let cutAt = buf.lastIndexOf('. ', maxCharsPerPage);
      if (cutAt < maxCharsPerPage * 0.5) cutAt = buf.lastIndexOf('\n', maxCharsPerPage);
      if (cutAt < maxCharsPerPage * 0.5) cutAt = maxCharsPerPage;
      pages.push(buf.slice(0, cutAt + 1).trim());
      buf = buf.slice(cutAt + 1).trim();
    }
  }
  if (buf.trim()) pages.push(buf.trim());
  return pages.length ? pages : [''];
}

// ?ㅽ뻾 留됰?洹몃옒??SVG ?앹꽦
function buildElementBarSVG(elements) {
  const items = [
    { key: '紐?, color: '#3a8c3a', label: '紐?(??' },
    { key: '??, color: '#c93838', label: '??(??' },
    { key: '??, color: '#a87b3a', label: '??(??' },
    { key: '湲?, color: '#9a9a9a', label: '湲?(??' },
    { key: '??, color: '#2c5d8a', label: '??(麗?' }
  ];
  const max = Math.max(...items.map(it => elements[it.key] || 0), 1);
  const W = 600, H = 320, leftPad = 80, topPad = 30, barW = 70, gap = 28;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:600px;display:block;margin:0 auto;">`;
  // Y異?(寃⑹옄)
  for (let i = 0; i <= 4; i++) {
    const y = topPad + (H - topPad - 60) * (i / 4);
    svg += `<line x1="${leftPad}" y1="${y}" x2="${W - 20}" y2="${y}" stroke="#e0ceb4" stroke-width="1" stroke-dasharray="3,3"/>`;
  }
  // 留됰?
  items.forEach((it, idx) => {
    const v = elements[it.key] || 0;
    const barH = (H - topPad - 60) * (v / max);
    const x = leftPad + 20 + idx * (barW + gap);
    const y = H - 60 - barH;
    svg += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${it.color}" opacity="0.85" rx="2"/>`;
    svg += `<text x="${x + barW / 2}" y="${y - 8}" text-anchor="middle" font-family="Noto Sans KR" font-size="16" font-weight="700" fill="#2c1810">${v}</text>`;
    svg += `<text x="${x + barW / 2}" y="${H - 30}" text-anchor="middle" font-family="Noto Sans KR" font-size="14" fill="#1a1209">${it.label}</text>`;
  });
  svg += `</svg>`;
  return svg;
}
