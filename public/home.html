<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사주 상담 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1a1209; --gold:#b8860b; --gold-l:#d4a843; --parchment:#f5ede0;
    --parch-d:#e0ceb4; --deep:#2c1810; --muted:#7a6652; --accent:#8b1a1a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--parchment); color: var(--ink);
    min-height: 100vh;
    background-image: radial-gradient(ellipse at 15% 40%, rgba(184,134,11,0.08) 0%, transparent 55%); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 18px; }
  .hdr { text-align: center; padding: 36px 0 20px; }
  .em { font-size: 42px; color: var(--gold); margin-bottom: 10px; }
  h1 { font-family: 'Noto Serif KR', serif; font-size: 24px; color: var(--deep); letter-spacing: 6px; }
  .sub { font-size: 12px; color: var(--muted); letter-spacing: 3px; margin-top: 4px; }
  .card { background: rgba(255,253,248,0.85); border: 1px solid var(--parch-d); padding: 22px 26px; margin-bottom: 16px; }
  .card-t { font-size: 11px; font-weight: 600; letter-spacing: 3px; color: var(--gold); margin-bottom: 14px; }
  input, button, textarea { font-family: inherit; font-size: 14px; }
  input { width: 100%; border: 1px solid var(--parch-d); padding: 12px; background: rgba(255,255,255,0.7);
    outline: none; margin-bottom: 10px; }
  input:focus { border-color: var(--gold); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  button { padding: 12px 18px; border: none; background: var(--deep); color: var(--gold-l);
    cursor: pointer; letter-spacing: 1px; transition: all 0.2s; }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-gold { background: linear-gradient(135deg, var(--gold), #a07000); color: var(--deep); font-weight: 700; }
  .btn-ghost { background: transparent; border: 1px solid var(--parch-d); color: var(--muted); }
  .btn-danger { background: var(--accent); color: #fff; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-full { width: 100%; padding: 14px; }
  .err { color: var(--accent); font-size: 13px; margin-top: 8px; text-align: center; }
  .ok { color: #2d9d52; font-size: 13px; margin-top: 8px; text-align: center; }

  /* 네비 */
  .nav { display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; background: rgba(255,253,248,0.9); border: 1px solid var(--parch-d); margin-bottom: 18px; }
  .nav .left { font-weight: 700; color: var(--deep); letter-spacing: 2px; }
  .nav .right { display: flex; gap: 8px; align-items: center; }
  .nav .uname { font-size: 13px; color: var(--muted); }

  /* 대시 */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat { background: rgba(184,134,11,0.08); padding: 16px; text-align: center; border: 1px solid rgba(184,134,11,0.2); }
  .stat .label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .stat .val { font-size: 24px; font-weight: 700; color: var(--deep); }

  /* 메뉴 */
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 20px 0; }
  .menu-item { background: rgba(255,253,248,0.85); border: 2px solid var(--parch-d); padding: 28px 24px;
    cursor: pointer; transition: all 0.2s; text-align: center; }
  .menu-item:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(44,24,16,0.12); }
  .menu-item .ic { font-size: 36px; margin-bottom: 10px; }
  .menu-item .ttl { font-size: 17px; font-weight: 700; color: var(--deep); margin-bottom: 6px; }
  .menu-item .desc { font-size: 12px; color: var(--muted); line-height: 1.6; }

  /* 리포트 목록 */
  .rep-item { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
    padding: 12px 16px; border: 1px solid var(--parch-d); margin-bottom: 6px; background: rgba(255,253,248,0.6); }
  .rep-item .nm { font-weight: 600; color: var(--deep); font-size: 14px; }
  .rep-item .mt { font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* API 키 */
  .key-col { display: flex; justify-content: space-between; align-items: center; }
  .key-dot { width: 8px; height: 8px; border-radius: 50%; background: #2d9d52; display: inline-block; margin-right: 6px; }

  /* 관리자 */
  .user-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center;
    padding: 10px 14px; border: 1px solid var(--parch-d); margin-bottom: 6px; background: rgba(255,253,248,0.6); }
  .badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .badge.pending { background: #fef3c7; color: #92400e; }
  .badge.active { background: #d1fae5; color: #065f46; }
  .badge.rejected, .badge.disabled { background: #fee2e2; color: #991b1b; }

  .hidden { display: none !important; }
  .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }

  @media(max-width:600px){ .menu,.stats{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>
<div class="wrap">

<!-- 로그인 -->
<div id="loginPage">
  <div class="hdr"><div class="em">☯</div><h1>사주 상담 시스템</h1><div class="sub">LOGIN</div></div>
  <div class="card" style="max-width:420px;margin:0 auto;">
    <div class="card-t">로그인</div>
    <input id="liName" placeholder="이름">
    <input id="liPw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-full btn-gold" onclick="doLogin()">로그인</button>
    <button class="btn-full btn-ghost" onclick="showSignup()" style="margin-top:8px;">회원가입</button>
    <div id="liMsg"></div>
  </div>
</div>

<!-- 가입 -->
<div id="signupPage" class="hidden">
  <div class="hdr"><div class="em">☯</div><h1>회원가입</h1><div class="sub">SIGN UP</div></div>
  <div class="card" style="max-width:420px;margin:0 auto;">
    <div class="card-t">가입 정보 입력</div>
    <input id="suName" placeholder="실명">
    <input id="suPw" type="password" placeholder="비밀번호 (4자 이상)">
    <input id="suPw2" type="password" placeholder="비밀번호 확인" onkeydown="if(event.key==='Enter')doSignup()">
    <button class="btn-full btn-gold" onclick="doSignup()">가입 신청</button>
    <button class="btn-full btn-ghost" onclick="showLogin()" style="margin-top:8px;">로그인으로</button>
    <div id="suMsg"></div>
    <div style="font-size:11px;color:var(--muted);margin-top:12px;text-align:center;line-height:1.7;">
      가입 신청 후 관리자 승인이 필요합니다.
    </div>
  </div>
</div>

<!-- 대시보드 (사용자) -->
<div id="dashPage" class="hidden">
  <div class="nav">
    <div class="left">🔮 사주 상담 시스템</div>
    <div class="right">
      <span class="uname" id="navName"></span>
      <button class="btn-ghost btn-sm" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="label">오늘 리포트</div><div class="val" id="stToday">0</div></div>
    <div class="stat"><div class="label">이번 주 리포트</div><div class="val" id="stWeek">0</div></div>
    <div class="stat"><div class="label">오늘 상담</div><div class="val" id="stMsgT">0</div></div>
    <div class="stat"><div class="label">이번 주 상담</div><div class="val" id="stMsgW">0</div></div>
  </div>

  <div class="card">
    <div class="card-t">OpenAI API 키</div>
    <div id="keyExpanded">
      <div class="row">
        <input type="password" id="apiKey" placeholder="sk-proj-...">
        <button class="btn-gold btn-sm" onclick="saveKey()" style="flex:0 0 auto;">저장</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;">
        키는 브라우저에만 저장됩니다. <a href="https://platform.openai.com/api-keys" target="_blank" style="color:var(--gold);">키 발급 페이지</a>
      </div>
    </div>
    <div id="keyCollapsed" class="key-col hidden">
      <div><span class="key-dot"></span>API 키 저장됨 (<span id="keyPrev"></span>)</div>
      <button class="btn-ghost btn-sm" onclick="editKey()">수정</button>
    </div>
  </div>

  <div class="menu">
    <div class="menu-item" onclick="location.href='/report.html'">
      <div class="ic">🔮</div>
      <div class="ttl">사주 리포트 만들기</div>
      <div class="desc">AI 40챕터 · 약 120페이지<br>PDF 자동 생성</div>
    </div>
    <div class="menu-item" onclick="location.href='/chat.html'">
      <div class="ic">💬</div>
      <div class="ttl">AI 상담 채팅</div>
      <div class="desc">저장된 리포트로<br>ChatGPT 스타일 상담</div>
    </div>
  </div>

  <div class="card">
    <div class="card-t">최근 리포트</div>
    <div id="repList"></div>
  </div>
</div>

<!-- 관리자 -->
<div id="adminPage" class="hidden">
  <div class="nav">
    <div class="left">👤 총관리자 페이지</div>
    <div class="right">
      <button class="btn-ghost btn-sm" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="card">
    <div class="card-t">가입 신청 대기 / 활성 사용자</div>
    <div id="userList"></div>
  </div>
</div>

</div>

<script>
let token = localStorage.getItem('auth_token') || '';
let currentUser = null;

function api(url, opts = {}) {
  return fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-auth-token': token, ...(opts.headers || {}) }
  });
}

async function init() {
  if (!token) return showLogin();
  const res = await fetch('/api/me', { headers: { 'x-auth-token': token }});
  if (!res.ok) { token = ''; localStorage.removeItem('auth_token'); return showLogin(); }
  const { user } = await res.json();
  currentUser = user;
  if (user.isAdmin) showAdmin();
  else showDash();
}

function showLogin() {
  document.querySelectorAll('#loginPage,#signupPage,#dashPage,#adminPage').forEach(e => e.classList.add('hidden'));
  document.getElementById('loginPage').classList.remove('hidden');
}
function showSignup() {
  document.querySelectorAll('#loginPage,#signupPage,#dashPage,#adminPage').forEach(e => e.classList.add('hidden'));
  document.getElementById('signupPage').classList.remove('hidden');
}

async function doSignup() {
  const name = document.getElementById('suName').value.trim();
  const password = document.getElementById('suPw').value;
  const passwordConfirm = document.getElementById('suPw2').value;
  const msg = document.getElementById('suMsg');
  const res = await fetch('/api/signup', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name, password, passwordConfirm })
  });
  const json = await res.json();
  if (!res.ok) { msg.className = 'err'; msg.textContent = json.error; return; }
  msg.className = 'ok'; msg.textContent = json.message;
  setTimeout(showLogin, 2000);
}

async function doLogin() {
  const name = document.getElementById('liName').value.trim();
  const password = document.getElementById('liPw').value;
  const msg = document.getElementById('liMsg');
  const res = await fetch('/api/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name, password })
  });
  const json = await res.json();
  if (!res.ok) { msg.className = 'err'; msg.textContent = json.error; return; }
  token = json.token;
  localStorage.setItem('auth_token', token);
  currentUser = json.user;
  if (json.user.isAdmin) showAdmin();
  else showDash();
}

async function doLogout() {
  await api('/api/logout', { method: 'POST' });
  token = ''; localStorage.removeItem('auth_token'); currentUser = null;
  showLogin();
}

async function showDash() {
  document.querySelectorAll('#loginPage,#signupPage,#dashPage,#adminPage').forEach(e => e.classList.add('hidden'));
  document.getElementById('dashPage').classList.remove('hidden');
  document.getElementById('navName').textContent = currentUser.name + ' 님';

  // 키 불러오기
  const saved = localStorage.getItem('openai_api_key');
  if (saved) { document.getElementById('apiKey').value = saved; collapseKey(saved); }

  // 통계
  const s = await (await api('/api/stats')).json();
  if (s.stats) {
    document.getElementById('stToday').textContent = s.stats.todayReports;
    document.getElementById('stWeek').textContent = s.stats.weekReports;
    document.getElementById('stMsgT').textContent = s.stats.todayMessages;
    document.getElementById('stMsgW').textContent = s.stats.weekMessages;
  }

  // 리포트 목록
  const r = await (await api('/api/reports')).json();
  const box = document.getElementById('repList');
  if (!r.reports || !r.reports.length) {
    box.innerHTML = '<div class="empty">아직 생성한 리포트가 없습니다. 위 메뉴에서 시작하세요.</div>';
  } else {
    box.innerHTML = r.reports.slice(0, 10).map(rep => {
      const d = new Date(rep.created_at).toLocaleDateString('ko-KR');
      return `<div class="rep-item">
        <div>
          <div class="nm">${escapeHtml(rep.client_name)} (${escapeHtml(rep.client_gender || '')})</div>
          <div class="mt">${escapeHtml(rep.client_birth || '')} · 생성 ${d} · 상담 ${rep.session_count}회</div>
        </div>
        <button class="btn-gold btn-sm" onclick="goChatNew(${rep.id})">상담 시작</button>
        <button class="btn-ghost btn-sm" onclick="delReport(${rep.id})">삭제</button>
      </div>`;
    }).join('');
  }
}

async function delReport(id) {
  if (!confirm('이 리포트를 삭제할까요?')) return;
  await api('/api/reports/' + id, { method: 'DELETE' });
  showDash();
}

async function goChatNew(reportId) {
  const res = await api('/api/sessions', {
    method: 'POST', body: JSON.stringify({ reportId })
  });
  const json = await res.json();
  if (!res.ok) return alert(json.error);
  location.href = '/chat.html?session=' + json.sessionId;
}

// 키 관리
function saveKey() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key || !key.startsWith('sk-')) { alert('올바른 키를 입력해주세요'); return; }
  localStorage.setItem('openai_api_key', key);
  collapseKey(key);
}
function collapseKey(key) {
  document.getElementById('keyExpanded').classList.add('hidden');
  document.getElementById('keyCollapsed').classList.remove('hidden');
  document.getElementById('keyPrev').textContent = key.slice(0, 7) + '...' + key.slice(-4);
}
function editKey() {
  document.getElementById('keyExpanded').classList.remove('hidden');
  document.getElementById('keyCollapsed').classList.add('hidden');
}

// 관리자
async function showAdmin() {
  document.querySelectorAll('#loginPage,#signupPage,#dashPage,#adminPage').forEach(e => e.classList.add('hidden'));
  document.getElementById('adminPage').classList.remove('hidden');
  const res = await api('/api/admin/users');
  const { users } = await res.json();
  const box = document.getElementById('userList');
  if (!users.length) { box.innerHTML = '<div class="empty">가입자가 없습니다.</div>'; return; }
  box.innerHTML = users.map(u => {
    const created = new Date(u.created_at).toLocaleDateString('ko-KR');
    const lastLogin = u.last_login_at ? new Date(u.last_login_at).toLocaleDateString('ko-KR') : '-';
    let actions = '';
    if (u.status === 'pending') {
      actions = `<button class="btn-gold btn-sm" onclick="approveUser(${u.id})">승인</button>
                 <button class="btn-danger btn-sm" onclick="rejectUser(${u.id})">거부</button>`;
    } else if (u.status === 'active') {
      actions = `<button class="btn-ghost btn-sm" onclick="disableUser(${u.id})">비활성화</button>
                 <button class="btn-danger btn-sm" onclick="delUser(${u.id})">삭제</button>`;
    } else {
      actions = `<button class="btn-gold btn-sm" onclick="approveUser(${u.id})">재활성화</button>
                 <button class="btn-danger btn-sm" onclick="delUser(${u.id})">삭제</button>`;
    }
    return `<div class="user-row">
      <div>
        <div style="font-weight:600;color:var(--deep);">${escapeHtml(u.name)}</div>
        <div style="font-size:11px;color:var(--muted);">가입 ${created} · 마지막 로그인 ${lastLogin} · 리포트 ${u.report_count} · 상담 ${u.chat_count}</div>
      </div>
      <span class="badge ${u.status}">${u.status}</span>
      ${actions}
    </div>`;
  }).join('');
}

async function approveUser(id) { await api('/api/admin/users/' + id + '/approve', { method: 'POST' }); showAdmin(); }
async function rejectUser(id) { await api('/api/admin/users/' + id + '/reject', { method: 'POST' }); showAdmin(); }
async function disableUser(id) { await api('/api/admin/users/' + id + '/disable', { method: 'POST' }); showAdmin(); }
async function delUser(id) {
  if (!confirm('정말 삭제할까요? 이 사용자의 모든 데이터가 삭제됩니다.')) return;
  await api('/api/admin/users/' + id, { method: 'DELETE' }); showAdmin();
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

init();
</script>
</body>
</html>
