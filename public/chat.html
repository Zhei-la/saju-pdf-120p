<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI ?곷떞 梨꾪똿</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1a1209; --gold:#b8860b; --gold-l:#d4a843; --parchment:#f5ede0;
    --parch-d:#e0ceb4; --deep:#2c1810; --muted:#7a6652; --accent:#8b1a1a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Noto Sans KR', sans-serif; background: var(--parchment); color: var(--ink); }
  body { display: flex; flex-direction: column; }

  /* ?곷떒 ?ㅻ뜑 */
  .hdr { display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; background: rgba(255,253,248,0.95); border-bottom: 1px solid var(--parch-d); }
  .hdr .ttl { font-weight: 700; color: var(--deep); letter-spacing: 2px; }
  .hdr button { background: transparent; border: 1px solid var(--parch-d); color: var(--muted);
    padding: 6px 12px; font-size: 12px; font-family: inherit; cursor: pointer; }
  .menu-btn { display: none; }

  /* 硫붿씤 ?덉씠?꾩썐 */
  .main { flex: 1; display: grid; grid-template-columns: 280px 1fr; min-height: 0; }

  /* ?ъ씠?쒕컮 */
  .side { background: rgba(255,253,248,0.7); border-right: 1px solid var(--parch-d);
    display: flex; flex-direction: column; min-height: 0; }
  .side-top { padding: 14px; border-bottom: 1px solid var(--parch-d); }
  .new-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--gold), #a07000);
    color: var(--deep); border: none; font-weight: 700; cursor: pointer; font-family: inherit;
    letter-spacing: 1px; font-size: 13px; }
  .session-list { flex: 1; overflow-y: auto; padding: 10px; }
  .session-item { padding: 12px 14px; margin-bottom: 4px; cursor: pointer; border: 1px solid transparent;
    font-size: 13px; color: var(--ink); border-radius: 2px; transition: all 0.15s; }
  .session-item:hover { background: rgba(184,134,11,0.08); }
  .session-item.active { background: rgba(184,134,11,0.15); border-color: var(--gold); }
  .session-item .st { font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .sm { font-size: 11px; color: var(--muted); }
  .session-item .del { float: right; background: transparent; border: none; color: var(--muted);
    cursor: pointer; font-size: 14px; padding: 0 4px; }
  .session-item .del:hover { color: var(--accent); }
  .side-empty { text-align: center; padding: 30px 20px; color: var(--muted); font-size: 12px; line-height: 1.7; }

  /* 梨꾪똿 硫붿씤 而⑦뀒?대꼫 (outer) */
  .chat-main { display: flex; flex-direction: column; min-height: 0; position: relative; }

  /* 梨꾪똿 ?붾㈃ (inner - chatView) */
  .chat { display: flex; flex-direction: column; min-height: 0; flex: 1; height: 100%; }
  .chat-info { padding: 12px 20px; background: rgba(255,253,248,0.5); border-bottom: 1px solid var(--parch-d);
    font-size: 12px; color: var(--muted); }
  .msgs { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .msg { margin-bottom: 20px; max-width: 85%; }
  .msg.user { margin-left: auto; }
  .msg.ai { margin-right: auto; }
  .msg .bub { padding: 12px 16px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
  .msg.user .bub { background: var(--deep); color: var(--gold-l); border-radius: 14px 14px 2px 14px; }
  .msg.ai .bub { background: rgba(255,253,248,0.95); color: var(--ink); border: 1px solid var(--parch-d);
    border-radius: 2px 14px 14px 14px; }
  .msg .time { font-size: 10px; color: var(--muted); margin-top: 4px; }
  .msg.user .time { text-align: right; }
  .msg .copy { float: right; margin-top: 4px; background: transparent; border: 1px solid var(--parch-d);
    color: var(--muted); padding: 3px 10px; font-size: 11px; font-family: inherit; cursor: pointer; }
  .msg .copy:hover { border-color: var(--gold); color: var(--deep); }

  /* ?낅젰李?*/
  .input-box { padding: 16px 20px; background: rgba(255,253,248,0.9); border-top: 1px solid var(--parch-d); }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; border: 1px solid var(--parch-d); background: rgba(255,255,255,0.8);
    padding: 12px 14px; font-family: inherit; font-size: 14px; outline: none; resize: none;
    min-height: 50px; max-height: 150px; line-height: 1.6; }
  textarea:focus { border-color: var(--gold); }
  .send-btn { padding: 12px 24px; background: linear-gradient(135deg, var(--gold), #a07000);
    color: var(--deep); border: none; font-weight: 700; cursor: pointer; font-family: inherit;
    letter-spacing: 1px; font-size: 13px; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 由ы룷???좏깮 ?붾㈃ */
  .picker { flex: 1; overflow-y: auto; padding: 30px; }
  .picker h2 { font-family: 'Noto Serif KR', serif; font-size: 20px; color: var(--deep);
    text-align: center; margin-bottom: 8px; letter-spacing: 2px; }
  .picker .sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 24px; }
  .picker .reports { max-width: 560px; margin: 0 auto; }
  .report-card { background: rgba(255,253,248,0.9); border: 2px solid var(--parch-d); padding: 16px 20px;
    margin-bottom: 10px; cursor: pointer; transition: all 0.15s; display: flex; justify-content: space-between; align-items: center; }
  .report-card:hover { border-color: var(--gold); transform: translateY(-1px); }
  .report-card .nm { font-weight: 700; color: var(--deep); font-size: 15px; margin-bottom: 4px; }
  .report-card .mt { font-size: 11px; color: var(--muted); }
  .report-card .arrow { color: var(--gold); font-size: 20px; }
  .empty-msg { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; line-height: 1.9; }

  /* ?곗뺨 */
  .welcome { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: var(--muted); text-align: center; padding: 40px; }
  .welcome .big { font-size: 48px; color: var(--gold); margin-bottom: 16px; }
  .welcome h3 { font-family: 'Noto Serif KR', serif; font-size: 18px; color: var(--deep); margin-bottom: 8px; }
  .welcome p { font-size: 13px; line-height: 1.9; }

  .loading-dots { display: inline-block; color: var(--muted); }
  .loading-dots::after { content: '...'; animation: dots 1.5s infinite; }
  @keyframes dots { 0%,20%{content:'.';} 40%{content:'..';} 60%,100%{content:'...';} }

  @media(max-width:768px) {
    .main { 
      display: flex; 
      flex-direction: column;
      grid-template-columns: none;
      position: relative;
      width: 100%;
    }
    .chat-main { 
      width: 100%;
      min-width: 0;
      flex: 1;
      min-height: calc(100vh - 52px);
      display: flex;
      flex-direction: column;
    }
    .chat { 
      width: 100%;
      flex: 1;
      min-height: 0;
    }
    .picker { 
      width: 100%;
      padding: 20px 16px;
    }
    .welcome {
      width: 100%;
      padding: 30px 20px;
    }
    .side { 
      position: fixed; 
      left: -100%; 
      top: 52px; 
      bottom: 0; 
      width: 280px; 
      z-index: 100;
      transition: left 0.25s ease; 
      border-right: 1px solid var(--parch-d);
      background: var(--parchment);
    }
    .side.open { 
      left: 0; 
      box-shadow: 2px 0 12px rgba(0,0,0,0.15); 
    }
    .menu-btn { display: inline-block; margin-right: 6px; }
    .input-box { 
      padding: 12px 14px;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); 
    }
    .msgs { padding: 16px 14px; }
    .msg { max-width: 92%; }
    .input-row { gap: 8px; }
    textarea { font-size: 15px; padding: 10px 12px; }
    .send-btn { padding: 10px 16px; font-size: 13px; }
    .hdr { padding: 10px 14px; }
    .hdr .ttl { font-size: 14px; letter-spacing: 1px; }
    .hdr button { font-size: 11px; padding: 5px 10px; }
    .report-card { padding: 14px 16px; }
    .picker h2 { font-size: 17px; }
    /* ?ъ씠?쒕컮 ?몃? ?대┃ ???リ린 ?꾪븳 ?ㅻ쾭?덉씠 */
    .side.open::before {
      content: '';
      position: fixed;
      left: 280px;
      top: 52px;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.3);
      z-index: -1;
    }
  }
</style>
</head>
<body>
<script>
if (!localStorage.getItem('auth_token')) location.href = '/';
</script>

<div class="hdr">
  <div class="ttl">?뮠 AI ?곷떞 梨꾪똿</div>
  <div>
    <button class="menu-btn" onclick="toggleSide()">??/button>
    <button onclick="location.href='/'">????쒕낫??/button>
  </div>
</div>

<div class="main">
  <!-- ?ъ씠?쒕컮 -->
  <div class="side" id="side">
    <div class="side-top">
      <button class="new-btn" onclick="showPicker()">+ ?????/button>
    </div>
    <div class="session-list" id="sessionList"></div>
  </div>

  <!-- 硫붿씤 -->
  <div class="chat-main">
    <!-- 由ы룷???좏깮 -->
    <div class="picker hidden" id="pickerView">
      <h2>?곷떞???ъ＜ ?좏깮</h2>
      <div class="sub">?대? ?앹꽦??由ы룷?몃? ?좏깮?섎㈃ AI媛 洹??ъ＜濡??곷떞??吏꾪뻾?⑸땲??/div>
      <div class="reports" id="reportList"></div>
    </div>

    <!-- ?곗뺨 -->
    <div class="welcome" id="welcomeView">
      <div class="big">??/div>
      <h3>AI ?곷떞 梨꾪똿</h3>
      <p>醫뚯륫?먯꽌 ??붾? ?좏깮?섍굅??br>"+ ?????瑜??뚮윭 ?쒖옉?섏꽭??/p>
    </div>

    <!-- 梨꾪똿 ?붾㈃ -->
    <div class="chat hidden" id="chatView">
      <div class="chat-info" id="chatInfo"></div>
      <div class="msgs" id="msgsBox"></div>
      <div class="input-box">
        <div class="input-row">
          <textarea id="msgInput" placeholder="吏덈Ц???낅젰?섏꽭??.." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMsg()">?꾩넚</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem('auth_token');
const userName = localStorage.getItem('current_user_name') || '';
let currentSessionId = null;
let currentReport = null;

function api(url, opts = {}) {
  return fetch(url, { ...opts, headers: { 'Content-Type': 'application/json', 'x-auth-token': token, ...(opts.headers || {}) }});
}
function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toggleSide() { document.getElementById('side').classList.toggle('open'); }

async function loadSessions() {
  const res = await api('/api/sessions');
  const { sessions } = await res.json();
  const box = document.getElementById('sessionList');
  if (!sessions.length) {
    box.innerHTML = '<div class="side-empty">?꾩쭅 ??붽? ?놁뒿?덈떎<br>+ ????붾? ?뚮윭 ?쒖옉?섏꽭??/div>';
    return;
  }
  box.innerHTML = sessions.map(s => {
    const d = new Date(s.updated_at).toLocaleDateString('ko-KR');
    return `<div class="session-item ${s.id === currentSessionId ? 'active' : ''}" onclick="openSession(${s.id})">
      <button class="del" onclick="event.stopPropagation();delSession(${s.id})">횞</button>
      <div class="st">${escapeHtml(s.title)}</div>
      <div class="sm">${s.msg_count || 0}媛?쨌 ${d}</div>
    </div>`;
  }).join('');
}

async function showPicker() {
  currentSessionId = null;
  document.getElementById('welcomeView').classList.add('hidden');
  document.getElementById('welcomeView').style.display = 'none';
  document.getElementById('chatView').style.display = 'none';
  document.getElementById('pickerView').classList.remove('hidden');
  document.getElementById('pickerView').style.display = 'block';

  const res = await api('/api/reports');
  const { reports } = await res.json();
  const box = document.getElementById('reportList');
  if (!reports.length) {
    box.innerHTML = '<div class="empty-msg">?앹꽦??由ы룷?멸? ?놁뒿?덈떎<br>癒쇱? <b>?ъ＜ 由ы룷??留뚮뱾湲?/b>?먯꽌 由ы룷?몃? ?앹꽦?댁＜?몄슂</div>';
    return;
  }
  box.innerHTML = reports.map(r => {
    const d = new Date(r.created_at).toLocaleDateString('ko-KR');
    return `<div class="report-card" onclick="createSession(${r.id})">
      <div>
        <div class="nm">${escapeHtml(r.client_name)} (${escapeHtml(r.client_gender || '')})</div>
        <div class="mt">${escapeHtml(r.client_birth || '')} 쨌 ${d}</div>
      </div>
      <div class="arrow">??/div>
    </div>`;
  }).join('');
  loadSessions();
}

async function createSession(reportId) {
  const res = await api('/api/sessions', { method: 'POST', body: JSON.stringify({ reportId }) });
  const json = await res.json();
  if (!res.ok) return alert(json.error);
  await loadSessions();
  openSession(json.sessionId);
}

async function openSession(sessionId) {
  currentSessionId = sessionId;
  const res = await api('/api/sessions/' + sessionId + '/messages');
  const { session, messages, report } = await res.json();
  currentReport = report;

  document.getElementById('welcomeView').classList.add('hidden');
  document.getElementById('welcomeView').style.display = 'none';
  document.getElementById('pickerView').classList.add('hidden');
  document.getElementById('pickerView').style.display = 'none';
  document.getElementById('chatView').style.display = 'flex';

  const s = report.saju_data;
  document.getElementById('chatInfo').innerHTML =
    `?뱥 <b>${escapeHtml(report.client_name)}</b> (${escapeHtml(report.client_gender || '')}) 쨌 ${escapeHtml(s.fullKorean || '')} 쨌 ?쇨컙 ${s.dayMaster?.korean || ''}`;

  renderMessages(messages);
  loadSessions();
  document.getElementById('side').classList.remove('open');
}

function renderMessages(messages) {
  const box = document.getElementById('msgsBox');
  if (!messages.length) {
    box.innerHTML = '<div class="welcome" style="height:100%;"><div class="big">?뮠</div><h3>???곷떞 ?쒖옉</h3><p>?꾨옒??吏덈Ц???낅젰???곷떞???쒖옉?섏꽭??/p></div>';
    return;
  }
  box.innerHTML = messages.map(m => {
    const t = new Date(m.created_at).toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'});
    if (m.role === 'user') {
      return `<div class="msg user"><div class="bub">${escapeHtml(m.content)}</div><div class="time">${t}</div></div>`;
    } else {
      return `<div class="msg ai"><div class="bub">${escapeHtml(m.content)}</div><div class="time">${t} <button class="copy" onclick="copyText(\`${m.content.replace(/`/g,'\\`').replace(/\$/g,'\\$')}\`)">蹂듭궗</button></div></div>`;
    }
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function copyText(text) {
  navigator.clipboard.writeText(text);
  alert('蹂듭궗?섏뿀?듬땲??);
}

async function sendMsg() {
  if (!currentSessionId) { alert('먼저 대화를 선택하세요'); return; }
  const input = document.getElementById('msgInput');
  const question = input.value.trim();
  if (!question) return;

  const apiKey = localStorage.getItem('gemini_api_key_' + userName);
  if (!apiKey) { alert('??쒕낫?쒖뿉??Gemini API ?ㅻ? 癒쇱? ??ν빐二쇱꽭??n(梨꾪똿? 臾대즺 Gemini瑜??ъ슜?⑸땲??'); return; }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = '?꾩넚 以?;
  input.value = '';

  // 利됱떆 ?좎? 硫붿떆吏 ?쒖떆
  const box = document.getElementById('msgsBox');
  const now = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'});
  box.insertAdjacentHTML('beforeend', `<div class="msg user"><div class="bub">${escapeHtml(question)}</div><div class="time">${now}</div></div>`);
  box.insertAdjacentHTML('beforeend', `<div class="msg ai" id="loadingMsg"><div class="bub"><span class="loading-dots">?듬? ?앹꽦 以?/span></div></div>`);
  box.scrollTop = box.scrollHeight;

  try {
    const res = await api('/api/sessions/' + currentSessionId + '/chat', {
      method: 'POST', body: JSON.stringify({ question, apiKey })
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || '?ㅻ쪟');

    // 濡쒕뵫 硫붿떆吏 ?쒓굅 ???덈줈 ?뚮뜑
    const msgRes = await api('/api/sessions/' + currentSessionId + '/messages');
    const { messages } = await msgRes.json();
    renderMessages(messages);
    loadSessions();
  } catch (e) {
    document.getElementById('loadingMsg')?.remove();
    alert('?ㅻ쪟: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '?꾩넚';
  }
}

async function delSession(id) {
  if (!confirm('????붾? ??젣?좉퉴??')) return;
  await api('/api/sessions/' + id, { method: 'DELETE' });
  if (currentSessionId === id) {
    currentSessionId = null;
    document.getElementById('chatView').style.display = 'none';
    document.getElementById('welcomeView').classList.remove('hidden');
    document.getElementById('welcomeView').style.display = 'flex';
  }
  loadSessions();
}

// 珥덇린??
loadSessions();

// URL ?뚮씪誘명꽣濡??몄뀡 吏??(??쒕낫?쒖뿉??諛붾줈 ?대룞)
const params = new URLSearchParams(location.search);
const sessionParam = params.get('session');
if (sessionParam) {
  openSession(parseInt(sessionParam));
}
</script>
<style>.hidden { display: none !important; }</style>
</body>
</html>
